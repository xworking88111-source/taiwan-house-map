# ==============================================================================
# GitHub Actions：每週自動更新資料並重新部署 App
#
# GitHub Actions 是什麼？
#   GitHub 免費提供的「雲端電腦」。你寫好步驟清單 (就是這個檔案)，
#   它就會在指定時間開一台乾淨的 Ubuntu 主機，照順序執行，做完就關機。
#   公開 (public) 的 repo 完全免費。
#
# 流程拆成 3 個工作 (job)，前一個成功才會執行下一個：
#
#   ① preflight 事前檢查 (約 3 分鐘)
#        金鑰能不能登入 shinyapps.io？App 需要的套件裝得起來嗎？
#        → 有問題「一開始」就失敗，不用等 ETL、訓練跑完才發現 (fail fast)
#   ② build 建置 (約 25~45 分鐘)
#        下載 → ETL → 地理編碼 → 空間特徵 → 訓練 → 屋況調整 → 匯出
#        → 產出的 App 資料打包成「產物 (artifact)」保存在 GitHub 上
#   ③ deploy 部署 (約 5 分鐘)
#        取出 artifact → 部署到 shinyapps.io
#
# 為什麼要拆？
#   原本是一個大工作：只要最後的部署失敗，重跑就得從下載資料開始，等 20 分鐘以上。
#   拆開後，部署失敗只要在 GitHub 網頁按「Re-run failed jobs」(或 gh run rerun --failed)，
#   就只重跑 ③，幾分鐘搞定。這也是業界 CI/CD「建置 (build) 與部署 (deploy) 分離」的做法。
#
# 要先在 GitHub repo 設定 Secrets (Settings → Secrets and variables → Actions)：
#   SHINYAPPS_NAME、SHINYAPPS_TOKEN、SHINYAPPS_SECRET、ANTHROPIC_API_KEY (選填)
# Secrets 是加密保存的，log 裡也會自動遮蔽，不會外洩。
# ==============================================================================
name: weekly-data-update

on:
  schedule:
    - cron: "0 19 * * 0"     # 每週日 19:00 UTC = 台灣時間週一 03:00 (cron 用的是 UTC 時間)
  workflow_dispatch:          # 也可以在 GitHub 網頁上按按鈕手動執行 (測試用)

# 所有工作共用的環境變數：讓 config.R 讀到雲端主機的路徑
env:
  RE_PROJECT_PATH: ${{ github.workspace }}

jobs:
  # ---------------------------------------------------------------------------
  # ① 事前檢查
  # ---------------------------------------------------------------------------
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true        # 使用預先編譯好的套件，安裝快很多
      - name: 安裝系統函式庫 (sf 需要的 GIS 工具)
        run: sudo apt-get update && sudo apt-get install -y libgdal-dev libgeos-dev libproj-dev libudunits2-dev
      # 只裝「部署」要用的套件 (App 本身 + rsconnect)
      # cpp11：tidyr 等套件編譯時需要，rsconnect 盤點套件版本時會檢查
      # ⚠️ 套件名稱不要加 any:: 前綴：any:: 安裝的套件會被記成 Source=any，
      #    rsconnect 不會替它換上下載網址 → shinyapps.io 安裝失敗 (Unsupported url scheme: RSPM/...)
      # ⚠️ 註解不能寫在 packages: | 的區塊裡：多行文字區塊中的 # 會被當成套件名稱的一部分
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            rsconnect
            shiny
            bslib
            leaflet
            plotly
            cachem
            dplyr
            sf
            xgboost
            RANN
            scales
            cpp11
      - name: 事前檢查 (金鑰、App 套件)
        env:
          SHINYAPPS_NAME: ${{ secrets.SHINYAPPS_NAME }}
          SHINYAPPS_TOKEN: ${{ secrets.SHINYAPPS_TOKEN }}
          SHINYAPPS_SECRET: ${{ secrets.SHINYAPPS_SECRET }}
        run: Rscript ci_preflight.R     # 金鑰、套件安裝、套件下載網址 (說明見 ci_preflight.R)

  # ---------------------------------------------------------------------------
  # ② 建置：資料管線 + 模型
  # ---------------------------------------------------------------------------
  build:
    needs: preflight                   # 事前檢查成功才執行
    runs-on: ubuntu-latest
    timeout-minutes: 120

    # 臨時的 PostgreSQL：只在這個工作期間存在，跑完就消失
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: runner
          POSTGRES_PASSWORD: runner
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5

    env:
      PGHOST: localhost
      PGUSER: runner
      PGPASSWORD: runner
      PGDATABASE: postgres

    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - name: 安裝系統函式庫 (sf 需要的 GIS 工具)
        run: sudo apt-get update && sudo apt-get install -y libgdal-dev libgeos-dev libproj-dev libudunits2-dev
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            tidyverse
            DBI
            RPostgres
            httr
            sf
            ranger
            xgboost
            scales
            RANN
            data.table

      # 快取：下載過的季資料 ZIP 和 OSM 圖資，下次直接用，不用每週重抓 1GB (也對政府伺服器比較禮貌)
      # 拆成「讀取 (restore)」和「存檔 (save)」兩步：
      #   actions/cache@v4 只有在「整個工作成功」時才存檔 → 前幾次後面的步驟失敗，資料每次都重新下載。
      #   改成下載完 (空間特徵算完) 就存，不管後面成不成功 (if: always())
      - uses: actions/cache/restore@v4
        with:
          path: |
            raw_history_zips
            geo_data
          key: re-data-${{ github.run_id }}
          restore-keys: re-data-

      - name: ETL (下載 → PostgreSQL → 清洗)
        run: Rscript new_All_data_ETL.R
      - name: 地理編碼
        run: Rscript new_geocode.R
      - name: 空間特徵 (設施距離)
        run: Rscript new_features.R
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: |
            raw_history_zips
            geo_data
          key: re-data-${{ github.run_id }}
      - name: 訓練模型
        run: Rscript new_model_training.R
      - name: 屋況與產權調整 (從備註量化影響)
        run: Rscript new_condition_adjust.R
      - name: 匯出 App 資料
        run: Rscript new_export_app_data.R

      # 把 App 需要的資料和模型打包成「產物」，交給下一個工作 (部署) 使用。
      # 產物保存 7 天：部署失敗時，重跑部署工作就直接拿這份，不用重新建置
      - uses: actions/upload-artifact@v4
        with:
          name: app-bundle
          path: |
            app/data
            app/models
          retention-days: 7

  # ---------------------------------------------------------------------------
  # ③ 部署
  # ---------------------------------------------------------------------------
  deploy:
    needs: build                       # 建置成功才執行
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - name: 安裝系統函式庫 (sf 需要的 GIS 工具)
        run: sudo apt-get update && sudo apt-get install -y libgdal-dev libgeos-dev libproj-dev libudunits2-dev
      # 部署時 rsconnect 會盤點 App 用到的套件版本，所以 App 的套件要裝在這台主機上
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            rsconnect
            shiny
            bslib
            leaflet
            plotly
            cachem
            dplyr
            sf
            xgboost
            RANN
            scales
            cpp11

      # 取出建置工作打包的產物，放回 app/ 底下 (app/data、app/models)
      - uses: actions/download-artifact@v4
        with:
          name: app-bundle
          path: app

      - name: 部署到 shinyapps.io
        env:
          SHINYAPPS_NAME: ${{ secrets.SHINYAPPS_NAME }}
          SHINYAPPS_TOKEN: ${{ secrets.SHINYAPPS_TOKEN }}
          SHINYAPPS_SECRET: ${{ secrets.SHINYAPPS_SECRET }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: Rscript deploy_app.R
